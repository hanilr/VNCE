[workspace]
resolver = "3"
members = ["crates/*"]

# Settings shared by every crate in the workspace.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"
authors = ["Hakkı Anıl Ragıboğlu (hanilr) <77579421+hanilr@users.noreply.github.com>"]
repository = "https://github.com/hanilr/VNCE"

# Lints shared by every crate in the workspace.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Shared dependency versions; crates opt in with `dep = { workspace = true }`.
[workspace.dependencies]
# Internal crates.
vnce-audio = { path = "crates/vnce-audio", version = "0.1.0" }
vnce-core = { path = "crates/vnce-core", version = "0.1.0" }
vnce-game = { path = "crates/vnce-game", version = "0.1.0" }
vnce-gpu = { path = "crates/vnce-gpu", version = "0.1.0" }
vnce-raster = { path = "crates/vnce-raster", version = "0.1.0", default-features = false }
vnce-runtime = { path = "crates/vnce-runtime", version = "0.1.0" }
vnce-term = { path = "crates/vnce-term", version = "0.1.0" }
vnce-ui = { path = "crates/vnce-ui", version = "0.1.0" }

# External crates.
bytemuck = { version = "1.25", features = ["derive"] }
cpal = { version = "0.18", default-features = false }
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events", "windows"] }
lewton = "0.10"
miniz_oxide = "0.8"
png = "0.18"
pollster = "1.0"
rustix = { version = "1.1", default-features = false, features = ["std", "event", "termios"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }
# Web backends are not needed in a terminal.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "gles", "vulkan", "wgsl"] }
