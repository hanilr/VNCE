[package]
name = "vnce-term"
description = "Cross-platform terminal output, double-buffered rendering and input for the Variation CLI Engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/vnce-term"
readme = "../../README.md"
keywords = ["terminal", "ansi", "tui", "input", "rendering"]
categories = ["command-line-interface", "rendering"]

[lib]
name = "vnce_term"

[lints]
workspace = true

[features]
default = ["png"]
# iTerm2 inline images (they are sent as PNG).
png = ["vnce-raster/png"]

[dependencies]
crossterm.workspace = true
vnce-raster.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
vnce-core.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# docs.rs documents every optional feature.
[package.metadata.docs.rs]
all-features = true
