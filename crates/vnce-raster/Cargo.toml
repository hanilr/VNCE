[package]
name = "vnce-raster"
description = "Pixel canvas, CPU rasterizer and pixel-to-terminal-cell modes for the Variation CLI Engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/vnce-raster"
readme = "../../README.md"
keywords = ["terminal", "graphics", "rasterizer", "pixel", "canvas"]
categories = ["command-line-interface", "graphics", "rendering"]

[lib]
name = "vnce_raster"

[lints]
workspace = true

[features]
default = ["png"]
# PNG image loading (pure Rust).
png = ["dep:png"]

[dependencies]
png = { workspace = true, optional = true }
vnce-core.workspace = true

[dev-dependencies]
unicode-width.workspace = true
