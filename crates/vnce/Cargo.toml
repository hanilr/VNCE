[package]
name = "vnce"
description = "A Rust library for building graphics and games in the terminal using the CPU and GPU. Part of the Variation ecosystem."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/vnce"
readme = "../../README.md"
keywords = ["terminal", "graphics", "game-engine", "tui", "gpu"]
categories = ["command-line-interface", "game-engines", "graphics", "rendering"]

[lib]
# Users import the crate as `vnce`.
name = "vnce"

[lints]
workspace = true

[dependencies]
vnce-core.workspace = true
vnce-term.workspace = true
vnce-runtime.workspace = true
vnce-raster = { workspace = true, features = ["png"] }
vnce-gpu = { workspace = true, optional = true }
vnce-ui = { workspace = true, optional = true }

[features]
default = ["ui"]
# Widgets (`vnce::vnce_ui`): layout, text, blocks, gauges, lists. Light, on by default.
ui = ["dep:vnce-ui"]
# GPU rendering with wgpu (`vnce::vnce_gpu`). Off by default: wgpu is a large dependency.
gpu = ["dep:vnce-gpu"]

[[example]]
name = "gpu_shader"
required-features = ["gpu"]

[[example]]
name = "gpu_cube"
required-features = ["gpu"]

[[example]]
name = "ui"
required-features = ["ui"]

# docs.rs documents every optional feature.
[package.metadata.docs.rs]
all-features = true
