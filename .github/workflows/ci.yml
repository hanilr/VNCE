# Checks every push to main and every pull request on Windows, Linux and macOS.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Warnings fail the build in CI (locally they stay warnings).
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # The toolchain comes from rust-toolchain.toml (stable, rustfmt, clippy).
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Mesa's software Vulkan driver (lavapipe) lets the GPU tests run on Linux. Windows
      # uses its software adapter (WARP); on macOS the tests skip without a Metal device.
      # The audio output (cpal) needs the ALSA development files on Linux.
      - name: Install a software Vulkan driver and ALSA
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libasound2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features
      - run: cargo test --locked --workspace --all-features
      - name: Test without default features
        run: cargo test --locked --workspace --no-default-features
      - run: cargo doc --locked --workspace --all-features --no-deps

  msrv:
    name: Minimum Rust version (1.87)
    runs-on: ubuntu-latest
    env:
      # Overrides rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: "1.87"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo check --locked --workspace --all-features --all-targets

  deny:
    name: Licenses, advisories and duplicates (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  license-files:
    name: LICENSE and NOTICE in every crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Every published crate must carry the same LICENSE and NOTICE as the repository.
      - run: |
          for crate in crates/*/; do
            cmp LICENSE "${crate}LICENSE"
            cmp NOTICE "${crate}NOTICE"
          done
